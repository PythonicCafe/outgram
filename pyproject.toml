[build-system]
requires = ["setuptools>=61,<68", "wheel<0.42"]
build-backend = "setuptools.build_meta"

[project]
name = "outgram"
version = "0.1.1"
description = "Client for Instagram and Threads public GraphQL APIs (Python library + CLI)"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.7"
license = {text = "GNU Lesser General Public License v3 (LGPLv3)"}
authors = [
    {name = "Álvaro Justen", email = "alvarojusten@gmail.com"},
]
keywords = ["instagram", "threads", "graphql", "api", "social-media"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "requests",
]

[project.urls]
Homepage = "https://github.com/PythonicCafe/outgram/"

[project.optional-dependencies]
img = [
    "pillow",
]
dev = [
    "autoflake",
    "black",
    "build",
    "coverage",
    "flake8",
    "ipython",
    "isort",
    "pdbpp",
    "pytest",
    "setuptools",
    "twine",
    "wheel",
]

[project.scripts]
outgram = "outgram.cli:main"

[tool.setuptools]
include-package-data = true
packages = ["outgram"]

[tool.pytest.ini_options]
markers = [
    "instagram_smoke: live public-Instagram smoke test; requires OUTGRAM_RUN_SMOKE=1",
    "threads_smoke: live public-Threads smoke test; requires OUTGRAM_RUN_THREADS_SMOKE=1",
]
